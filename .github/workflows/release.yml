name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[tui]" pytest ruff==0.15.0
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python scripts/check_docs.py

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install standalone build dependencies
        run: python -m pip install --only-binary=shazamio-core,pydantic-core ".[tui,recognition,lyrics,musicbrainz,shazam]" pyinstaller==6.22.0
      - name: Build portable Windows executable
        run: python scripts/build_windows.py
      - name: Verify standalone CLI and TUI processing
        run: python scripts/verify_windows.py dist/windows/musren-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/windows/*

  tauri-linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev wget xvfb dbus-x11
      - name: Install Python worker dependencies
        run: python -m pip install -e '.[desktop]'
      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Build Debian package
        working-directory: desktop
        run: bun run tauri build --bundles deb
      - name: Install and launch Debian package
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find "$GITHUB_WORKSPACE/desktop/src-tauri/target/release/bundle/deb" -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          sudo apt-get install -y "$deb"
          set +e
          timeout 15s xvfb-run -a dbus-run-session -- musren-desktop
          result=$?
          set -e
          test "$result" -eq 124
          mkdir -p dist/tauri-linux
          cp "$deb" dist/tauri-linux/
          sudo apt-get remove -y musren
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-deb
          path: dist/tauri-linux/*.deb

  publish:
    needs: [validate, windows, tauri-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: tauri-linux-deb
          path: dist/tauri-linux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build release artifacts
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Verify version and release contents
        run: python scripts/verify_release.py --tag "${{ github.ref_name }}" --dist dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt dist/windows/* dist/tauri-linux/* --verify-tag --title "musren ${{ github.ref_name }}" --notes-file docs/changelog.md
