name: CI

on:
  push:
    branches: [main, dev, feature/tui]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install the product
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest ruff==0.15.0 twine
          python -m build
          python -m pip install ".[tui]"
          python -m twine check dist/*
      - name: Validate style
        run: |
          python -m ruff format --check .
          python -m ruff check .
      - name: Test all workflows and responsive layouts
        run: python -m pytest -q
      - name: Check documentation links
        run: python scripts/check_docs.py
      - name: Check installed launchers
        run: |
          musren --version
          musren --help
          python -c "from core.tui.app import MusrenApp; print('TUI import passed')"

  cli-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - run: musren --version
