[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musren"
dynamic = ["version"]
description = "Music file renamer with metadata, lyrics, covers and recognition"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cosLatte", email = "gabrielpazruiz02@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mutagen>=1.45",
    "requests>=2.28",
    "typer>=0.9",
    "rich>=13.0",
    "python-dotenv>=0.21",
    "keyring>=25.7.0",
]

[project.optional-dependencies]
tui = ["textual>=0.85,<1"]
recognition = ["pyacoustid>=1.0"]
lyrics = ["syncedlyrics>=1.0.1"]
musicbrainz = ["musicbrainzngs>=0.7.1"]
shazam = ["shazamio>=0.6"]
desktop = ["pyinstaller>=6.22.0"]
dev = ["pytest>=7", "ruff==0.15.0", "build>=1", "twine>=5"]

[project.scripts]
musren = "musren.entrypoint:main"
musren-tui = "musren.entrypoint:tui"

[project.urls]
Homepage = "https://github.com/coslatte/musren"
Releases = "https://github.com/coslatte/musren/releases"
Issues = "https://github.com/coslatte/musren/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "musren.constants.info.MUSIC_RENAMER_VERSION" }

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/musren/constants/info.py" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
