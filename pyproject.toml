[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musren"
dynamic = ["version"]
description = "Music file renamer with metadata, lyrics, covers and recognition"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "cosLatte", email = "gabrielpazruiz02@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mutagen>=1.45",
    "requests>=2.28",
    "typer>=0.9",
    "rich>=13.0",
    "python-dotenv>=0.21",
]

[project.optional-dependencies]
tui = ["textual>=0.85,<1; python_version >= '3.9'"]
recognition = ["pyacoustid>=1.0"]
lyrics = ["syncedlyrics>=1.0.1"]
musicbrainz = ["musicbrainzngs>=0.7.1"]
shazam = ["shazamio>=0.6; python_version >= '3.9'"]
dev = ["pytest>=7", "ruff==0.15.0", "build>=1", "twine>=5"]

[project.scripts]
musren = "app:main"
musren-tui = "app:tui"

[project.urls]
Homepage = "https://github.com/coslatte/musren"
Releases = "https://github.com/coslatte/musren/releases"
Issues = "https://github.com/coslatte/musren/issues"

[tool.setuptools]
py-modules = ["app"]
packages = ["constants", "core", "core.cli", "core.cli.commands", "core.tui", "utils"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "constants.info.MUSIC_RENAMER_VERSION" }

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "constants/info.py" }]
